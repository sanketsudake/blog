name: Publish to GitHub Pages Repo

# DISABLED 2026-04-30: site migrated to Cloudflare. The custom domain
# ssudake.com is now bound to the Workers project, so this workflow no longer
# drives production. Kept temporarily for reference and will be deleted once we
# are confident we won't need to fall back to GitHub Pages.
#
# Original trigger:
#   on:
#     push:
#       branches:
#         - master
on:
  workflow_dispatch:

jobs:
  build:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.1
          cache: true

      - name: Deploy the site
        uses: benmatselby/hugo-deploy-gh-pages@main
        env:
          HUGO_VERSION: 0.157.0
          GO_VERSION: 1.26.1
          TARGET_REPO: sanketsudake/sanketsudake.github.io
          TARGET_BRANCH: master
          TOKEN: ${{ secrets.SYNC_BUILD_TOKEN }}
          CNAME: ssudake.com